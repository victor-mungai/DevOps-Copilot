AWSTemplateFormatVersion: "2010-09-09"

Description: >
  DevOps Copilot AWS Integration Role.
  Provides read-only access to AWS infrastructure metadata,
  CloudWatch metrics, resource tags, and AWS Cost Explorer.

Parameters:

  ExternalId:
    Type: String
    Description: >
      Unique External ID generated by DevOps Copilot for this tenant.
    NoEcho: true

  PlatformAccountId:
    Type: String
    Description: >
      AWS Account ID of the DevOps Copilot platform.
    AllowedPattern: "^[0-9]{12}$"
    ConstraintDescription: Must be a valid 12-digit AWS account ID.

Resources:

  DevOpsCopilotRole:
    Type: AWS::IAM::Role

    Properties:

      # Each tenant must have an independent role because its ExternalId is tenant-specific.
      RoleName: !Sub "DevOpsCopilotRole-${ExternalId}"

      Description: >
        Read-only cross-account role used by DevOps Copilot
        to monitor AWS infrastructure, metrics, and costs.

      AssumeRolePolicyDocument:

        Version: "2012-10-17"

        Statement:

          - Sid: DevOpsCopilotPlatformAccess

            Effect: Allow

            Principal:
              AWS:
                - !Sub "arn:aws:iam::${PlatformAccountId}:root"

            Action:
              - sts:AssumeRole

            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId

      Policies:

        - PolicyName: DevOpsCopilotReadOnly

          PolicyDocument:

            Version: "2012-10-17"

            Statement:

              # --------------------------------------------------
              # EC2 RESOURCE DISCOVERY
              # --------------------------------------------------

              - Sid: EC2ReadOnly

                Effect: Allow

                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeTags
                  - ec2:DescribeVolumes
                  - ec2:DescribeRegions

                Resource: "*"


              # --------------------------------------------------
              # RDS RESOURCE DISCOVERY
              # --------------------------------------------------

              - Sid: RDSReadOnly

                Effect: Allow

                Action:
                  - rds:DescribeDBInstances
                  - rds:DescribeDBClusters
                  - rds:ListTagsForResource

                Resource: "*"


              # --------------------------------------------------
              # LAMBDA RESOURCE DISCOVERY
              # --------------------------------------------------

              - Sid: LambdaReadOnly

                Effect: Allow

                Action:
                  - lambda:ListFunctions
                  - lambda:ListTags
                  - lambda:GetFunctionConfiguration

                Resource: "*"


              # --------------------------------------------------
              # CLOUDWATCH METRICS
              # --------------------------------------------------

              - Sid: CloudWatchMetricsReadOnly

                Effect: Allow

                Action:
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:GetMetricData
                  - cloudwatch:ListMetrics

                Resource: "*"


              # --------------------------------------------------
              # AWS COST EXPLORER
              # --------------------------------------------------

              - Sid: CostExplorerReadOnly

                Effect: Allow

                Action:
                  - ce:GetCostAndUsage
                  - ce:GetCostForecast
                  - ce:GetDimensionValues
                  - ce:GetTags

                Resource: "*"


Outputs:

  RoleArn:

    Description: ARN of the DevOps Copilot cross-account IAM role

    Value: !GetAtt DevOpsCopilotRole.Arn

  RoleName:

    Description: Name of the DevOps Copilot IAM role

    Value: !Ref DevOpsCopilotRole
